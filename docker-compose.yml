services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medic_backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL:-https://phxsdgkergzxhljhnteu.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-sb_publishable_V6ZWzZMSbrnN9ZCP_bEoYA_yaXC07B-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    ports:
      - "3001:3001"
    networks:
      - medic_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://phxsdgkergzxhljhnteu.supabase.co}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-sb_publishable_V6ZWzZMSbrnN9ZCP_bEoYA_yaXC07B-}
        - VITE_API_URL=/
    container_name: medic_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - medic_net

networks:
  medic_net:
    driver: bridge
